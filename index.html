<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceBot - AI Price Comparison</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: linear-gradient(135deg, #000000 0%, #0a1628 50%, #000000 100%);
      min-height: 100vh;
      font-family: 'Rajdhani', sans-serif;
      color: #ffffff;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 30%, rgba(30, 58, 138, 0.4) 0%, transparent 50%),
                  radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.3) 0%, transparent 50%);
      z-index: 0;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .grid-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
      background-size: 40px 40px; z-index: 0;
    }

    .main-container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 2rem; }

    .header {
      text-align: center; padding: 3rem 0 2rem; margin-bottom: 2rem;
    }

    .robot-icon {
      font-size: 4rem; margin-bottom: 1rem;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.8));
      cursor: pointer;
    }

    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-15px); } }

    .header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem; font-weight: 900;
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1e40af 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem; letter-spacing: 6px;
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.8)); }
      50% { filter: drop-shadow(0 0 40px rgba(59, 130, 246, 1)); }
    }

    .header .subtitle {
      font-family: 'Orbitron', sans-serif;
      color: #60a5fa; font-size: 1.6rem; font-weight: 700;
      letter-spacing: 3px; margin: 0.3rem 0;
      text-shadow: 0 0 15px rgba(96, 165, 250, 0.6);
    }

    .search-section {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.9) 100%);
      border: 2px solid #1e40af; border-radius: 16px; padding: 2.5rem; margin-bottom: 2rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(30, 64, 175, 0.3);
      position: relative;
    }

    .search-section::before {
      content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, #1e40af, #3b82f6, #60a5fa, #3b82f6, #1e40af);
      background-size: 300% 300%; border-radius: 16px; z-index: -1;
      animation: borderFlow 4s ease infinite;
    }

    @keyframes borderFlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

    .search-label {
      color: #60a5fa; font-size: 1.2rem; font-weight: 700;
      margin-bottom: 1rem; display: block;
      text-transform: uppercase; letter-spacing: 2px;
    }

    .search-input {
      background: rgba(0, 0, 0, 0.7); border: 2px solid #1e40af; border-radius: 10px;
      color: #ffffff; padding: 1.2rem 1.5rem; font-size: 1.1rem; width: 100%;
      transition: all 0.3s ease; font-weight: 500;
    }

    .search-input:focus {
      outline: none; border-color: #3b82f6; background: rgba(0, 0, 0, 0.9);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); transform: translateY(-2px);
    }

    .search-input::placeholder { color: #6b7280; }

    .checkbox-group {
      margin: 1.5rem 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
    }

    .checkbox-label {
      display: flex; align-items: center; cursor: pointer;
      color: #93c5fd; font-size: 1rem; font-weight: 600;
      transition: all 0.3s ease; padding: 0.8rem; border-radius: 8px;
      background: rgba(30, 64, 175, 0.1); border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .checkbox-label:hover {
      color: #60a5fa; background: rgba(30, 64, 175, 0.2);
      transform: translateY(-2px);
    }

    .checkbox-input {
      width: 18px; height: 18px; margin-right: 0.8rem; cursor: pointer;
      accent-color: #3b82f6; border-radius: 4px;
    }

    .checkbox-text { user-select: none; }

    .search-btn {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      border: none; border-radius: 10px; color: #ffffff;
      font-size: 1.2rem; font-weight: 700; padding: 1.2rem 3rem;
      margin-top: 1.5rem; width: 100%; cursor: pointer;
      transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px;
      position: relative; overflow: hidden;
      box-shadow: 0 10px 30px rgba(30, 64, 175, 0.4);
    }

    .search-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .search-btn:hover::before { left: 100%; }

    .search-btn:hover {
      background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
      transform: translateY(-3px); box-shadow: 0 15px 40px rgba(59, 130, 246, 0.6);
    }

    .loading {
      text-align: center; padding: 3rem; display: none;
    }

    .spinner {
      width: 60px; height: 60px; margin: 0 auto 1.5rem;
      border: 4px solid rgba(30, 64, 175, 0.3);
      border-top: 4px solid #3b82f6; border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .loading-text {
      color: #60a5fa; font-size: 1.2rem; font-weight: 700; letter-spacing: 2px;
    }

    .results-section { display: none; animation: fadeIn 0.5s ease-in; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .results-header {
      text-align: center; margin-bottom: 2rem;
    }

    .results-header h2 {
      font-family: 'Orbitron', sans-serif; font-size: 2.2rem;
      color: #60a5fa; letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(96, 165, 250, 0.5);
    }

    .results-table {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.9) 100%);
      border: 2px solid #1e40af; border-radius: 16px; overflow: hidden;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(30, 64, 175, 0.3);
    }

    .results-table table { width: 100%; margin: 0; }

    .results-table thead {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
    }

    .results-table th {
      color: #ffffff; font-weight: 700; text-transform: uppercase;
      padding: 1.2rem; border: none; letter-spacing: 1px; font-size: 1rem;
    }

    .results-table td {
      padding: 1.2rem; color: #e2e8f0;
      border-bottom: 1px solid rgba(30, 64, 175, 0.3);
      vertical-align: middle; font-size: 1rem;
    }

    .results-table tbody tr {
      background: rgba(0, 0, 0, 0.3); transition: all 0.3s ease;
    }

    .results-table tbody tr:hover {
      background: rgba(30, 64, 175, 0.4); transform: scale(1.01);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
    }

    .view-btn {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      border: none; border-radius: 6px; color: #ffffff;
      padding: 0.6rem 1.5rem; text-decoration: none;
      display: inline-block; font-weight: 600;
      transition: all 0.3s ease; text-transform: uppercase;
    }

    .view-btn:hover {
      background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
      color: #ffffff; transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
    }

    .no-results {
      color: #94a3b8; text-align: center; padding: 2rem; font-size: 1.1rem;
    }

    @media (max-width: 768px) {
      .header h1 { font-size: 2.5rem; letter-spacing: 3px; }
      .robot-icon { font-size: 3rem; }
      .search-section { padding: 1.5rem; }
      .checkbox-group { grid-template-columns: 1fr; }
      .results-table { overflow-x: auto; }
      .results-table th, .results-table td { padding: 0.8rem; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  
  <div class="main-container">
    <div class="header">
      <div class="robot-icon">🤖</div>
      <h1>WELCOME TO</h1>
      <div class="subtitle">4 HARBINGERS</div>
      <div class="subtitle">PRICEBOT</div>
    </div>

    <div class="search-section">
      <form id="compareForm">
        <label class="search-label">🔍 Product Search</label>
        <input id="product" class="search-input" placeholder="Enter product name (e.g., iPhone 14)" required>
        
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="secondhand" class="checkbox-input">
            <span class="checkbox-text">Include Second-hand (OLX)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="industrial" class="checkbox-input">
            <span class="checkbox-text">Include Industrial (IndiaMart)</span>
          </label>
        </div>
        
        <button type="submit" class="search-btn">Search Now</button>
      </form>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p class="loading-text">SCANNING PRICES...</p>
    </div>

    <div id="results" class="results-section">
      <div class="results-header">
        <h2>⚡ RESULTS</h2>
      </div>
      <div class="results-table">
        <table>
          <thead>
            <tr>
              <th>Website</th>
              <th>Product</th>
              <th>Price</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("compareForm");
    const loading = document.getElementById("loading");
    const results = document.getElementById("results");
    const tbody = document.getElementById("resultsBody");

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const product = document.getElementById("product").value.trim();
      const secondhand = document.getElementById("secondhand").checked;
      const industrial = document.getElementById("industrial").checked;
      
      loading.style.display = "block";
      results.style.display = "none";
      tbody.innerHTML = "";

      try {
        const res = await fetch("/api/scrape", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({product, secondhand, industrial})
        });
        
        const data = await res.json();
        loading.style.display = "none";

        if (!data.length) {
          tbody.innerHTML = `<tr><td colspan="4" class="no-results">No results found.</td></tr>`;
          results.style.display = "block";
        } else {
          results.style.display = "block";
          data.forEach(item => {
            tbody.innerHTML += `
              <tr>
                <td><strong>${item.website}</strong></td>
                <td>${item.title}</td>
                <td><strong style="color: #60a5fa;">${item.price_display}</strong></td>
                <td><a href="${item.link}" class="view-btn" target="_blank">View</a></td>
              </tr>`;
          });
        }
      } catch (error) {
        loading.style.display = "none";
        tbody.innerHTML = `<tr><td colspan="4" class="no-results">Error occurred. Try again.</td></tr>`;
        results.style.display = "block";
      }
    });
  </script>
</body>
</html>
